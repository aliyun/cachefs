syntax = "proto3";

package cachefs;

import "validate/validate.proto";

option go_package = ".;cachefs";

message QueryRequest{
  // target path is within 4096
  string target = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
  uint32 block_num = 2;
  // only support 4M 8M 16M 32M 64M 128M block sizes
  uint32 block_size = 4 [(validate.rules).uint32 = {in: [4194304,8388608,16777216,33554432,67108864,134217728]}];
}

message QueryResponse{
  repeated string nodes = 1;
  string serf_group = 2;
}

service CachefsCacheRoot{
  rpc Query(QueryRequest) returns(QueryResponse);
}
