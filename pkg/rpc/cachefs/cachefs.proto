syntax = "proto3";

package cachefs;

import "validate/validate.proto";

option go_package = ".;cachefs";

message LoadRequest{
  // target path is within 4096
  string target = 1 [(validate.rules).string = {min_len: 1, max_len: 4096}];
  uint32 block_num = 2;
  // less than or equal to largest block size
  uint32 len = 3 [(validate.rules).uint32 = {gte: 1, lte: 134217728}];
  // only support 4M 8M 16M 32M 64M 128M block sizes
  uint32 block_size = 4 [(validate.rules).uint32 = {in: [4194304,8388608,16777216,33554432,67108864,134217728]}];
  string serf_group = 5 [(validate.rules).string = {min_len: 0, max_len: 256}];
  string cache_root_group = 6 [(validate.rules).string = {min_len: 0, max_len: 256}];
  bool supports_fallback = 7;
  bool use_fallback = 8;
}

message LoadResponse{
  bytes data = 1;
  string addr = 2 [(validate.rules).string = {min_len: 0, max_len: 4096}];
  string hash = 3 [(validate.rules).string = {min_len: 0, max_len: 128}];
  uint64 req_id = 4;
  uint32 svc_id = 5;
  string fallback_addr = 6 [(validate.rules).string = {min_len: 0, max_len: 4096}];
}

message ExchangeTrackerRequest{
  string serf_group = 1 [(validate.rules).string = {min_len: 0, max_len: 256}];
  bytes meta_info = 2;
}

message ExchangeTrackerResponse{
  bytes meta_info = 1;
}

service CachefsCache{
  rpc Load(stream LoadRequest) returns(stream LoadResponse);
  rpc ExchangeTracker(ExchangeTrackerRequest) returns(ExchangeTrackerResponse);
}
